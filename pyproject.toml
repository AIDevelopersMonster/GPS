[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpslab"
version = "0.1.0"
description = "GPS/GNSS diagnostic core with CLI and GUI tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
]

[project.scripts]
gps-cli = "gpslab.cli:main"
gps-gui = "gpslab.gui:main"
gps-registry = "gpslab.registry_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
